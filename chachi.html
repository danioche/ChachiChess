<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChachiChess &#9822;&#9823;</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/board.css">
    <link rel="stylesheet" href="static/css/menu.css">
    <link rel="stylesheet" href="static/css/chat.css">
</head>
<body>
<button id="side-menu-toggle" title="Menu">&#9776;</button>
<div id="scoreboards-container" style="display: flex; gap: 12px; justify-content: center; padding: 12px 0; background: #f7f7fa; border-bottom: 1px solid #e0e0e0;">
    <!-- White Player Scoreboard -->
    <div id="scoreboard-white" style="background: white; border-radius: 8px; padding: 12px 16px; border: 2px solid #d4af37; min-width: 200px; text-align: center;">
        <div style="font-weight: 600; font-size: 0.95em; color: #333; margin-bottom: 8px;">White's Capture</div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
            <div style="flex: 1;">
                <div id="white-pieces" style="font-size: 1.2em; line-height: 1.4; min-height: 40px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-items: center;">
                    <!-- Captured pieces will appear here -->
                </div>
            </div>
            <div style="text-align: center; padding-left: 12px; border-left: 2px solid #e0e0e0;">
                <div style="font-size: 0.85em; color: #666;">Points</div>
                <div id="white-points" style="font-size: 1.8em; font-weight: bold; color: #d4af37;">0</div>
            </div>
        </div>
    </div>
    
    <!-- Black Player Scoreboard -->
    <div id="scoreboard-black" style="background: white; border-radius: 8px; padding: 12px 16px; border: 2px solid #333; min-width: 200px; text-align: center;">
        <div style="font-weight: 600; font-size: 0.95em; color: #333; margin-bottom: 8px;">Black's Capture</div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
            <div style="flex: 1;">
                <div id="black-pieces" style="font-size: 1.2em; line-height: 1.4; min-height: 40px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-items: center;">
                    <!-- Captured pieces will appear here -->
                </div>
            </div>
            <div style="text-align: center; padding-left: 12px; border-left: 2px solid #e0e0e0;">
                <div style="font-size: 0.85em; color: #666;">Points</div>
                <div id="black-points" style="font-size: 1.8em; font-weight: bold; color: #333;">0</div>
            </div>
        </div>
    </div>
</div>
<div id="side-menu">
    <div id="side-menu-header">ChachiChess &#9822;&#9823;</div>
    <div id="side-menu-content">
        <div>
            <label for="player1-name">White's Player:</label>
            <input type="text" id="player1-name" placeholder="White" autocomplete="off">
        </div>
        <div>
            <label for="player2-name">Black's Player:</label>
            <input type="text" id="player2-name" placeholder="Black" autocomplete="off">
        </div>
        <div>
            <label for="pgn-area">PGN Notation:</label>
            <textarea id="pgn-area" readonly></textarea>
        </div>
        <button id="fen-btn">💾 Get FEN</button>
        <button id="restart-btn">⟳ Restart Game</button>
        <button id="flip-board-btn">↳↰ Flip Board</button>
        <button id="time-machine-btn"><img src="static/img/timeMachine.png">Time Machine</button>
    </div>
</div>
<div class="chess-board-container" id="chess-board-container"></div>
<div class="chess-board-timeMachine" id="chess-board-timeMachine" style="display:none;">
    <button id="bwd" title="Back" onclick="timeMachineDo(-1)" disabled>&lArr;</button>
    <button id="fwd" title="Forward" onclick="timeMachineDo(1)" disabled>&rArr;</button>
</div>
<button id="right-menu-toggle" title="Right Menu" style="position:fixed; top:20px; right:20px; z-index:1100;">&#9776;</button>
<div id="right-side-menu" style="position:fixed; top:0; right:-320px; width:300px; height:100vh; background:#f7f7fa; box-shadow:-2px 0 12px rgba(0,0,0,0.08); z-index:1099; transition:right 0.3s; display:flex; flex-direction:column;">
    <div style="padding:18px 18px 10px 18px; font-weight:600; font-size:1.2em; border-bottom:1px solid #e0e0e0;">
        ChachiChess Club 💬 
        <button id="right-menu-close" style="float:right; background:none; border:none; font-size:1.3em; color:#888; cursor:pointer;">&times;</button>
    </div>
    <div style="padding:18px; flex:1; overflow-y:auto;">
        <!-- Add your right menu content here -->
        <p>Here you can chat with the lovely people of the ChachiChess Club</p>
    
        <div id="connected-users" style="margin-bottom:18px;">
            <strong>Connected Users:</strong>
            <ul id="user-list" style="list-style:none; padding-left:0; margin-top:6px;">
                <li>
                    <img src="/static/themes/default/teachers/daniocheChessTeacher_avatar2.png" alt="User Avatar" style="vertical-align:middle; border-radius:50%; margin-right:6px;" width="48px">
                    <div style="display:block; float:right; width:78%">
                        ChachiChess teacher<button title="ChachiChess Teacher is the main teacher of the ChachiChess Club" style="background:none; border:none; font-size:1em; color:#4a90e2; cursor:default;">&#9432;</button>
                        <button id="chat-with-teacher-btn" >Chat</button>
                    </div>
                </li>
                <li>
                    <img src="/static/themes/default/teachers/teacher2.png" alt="User Avatar" style="vertical-align:middle; border-radius:50%; margin-right:6px;" width="48px">
                    <span>Paco Teacher</span>
                </li>
                <li>
                    <img src="/static/themes/default/teachers/teacher3.png" alt="User Avatar" style="vertical-align:middle; border-radius:50%; margin-right:6px;" width="48px">
                    <span>Sara Teacher</span>
                </li>
            </ul>
        </div>
        <!-- Chat Box Dialog -->
        <div id="chat-box" style="display:flex; flex-direction:column; height:320px; border:1px solid #e0e0e0; border-radius:6px; margin-bottom:18px; background:#fff;">
            <div id="chat-messages" style="flex:1; padding:10px; overflow-y:auto; font-size:0.98em;"></div>
            <form id="chat-form" style="display:flex; border-top:1px solid #e0e0e0;">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" style="flex:1; border:none; padding:10px; font-size:1em; outline:none;">
                <button type="submit" style="background:#4a90e2; color:#fff; border:none; padding:0 18px; font-size:1em; cursor:pointer;">Send</button>
            </form>
        </div>
        <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        chatForm.onsubmit = function(e) {
            e.preventDefault();
            const msg = chatInput.value.trim();
            if (msg) {
                const div = document.createElement('div');
                div.textContent = msg;
                div.style.margin = '6px 0';
                div.style.padding = '6px 10px';
                div.style.background = '#f1f3fa';
                div.style.borderRadius = '5px';
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                chatInput.value = '';
            }
        };
        </script>
    </div>
</div>
<script>
const rightMenu = document.getElementById('right-side-menu');
const rightMenuToggle = document.getElementById('right-menu-toggle');
const rightMenuClose = document.getElementById('right-menu-close');
rightMenuToggle.onclick = () => {
    rightMenu.style.right = '0';
};
rightMenuClose.onclick = () => {
    rightMenu.style.right = '-320px';
};
// Optional: Hide toggle button when menu is open
rightMenu.addEventListener('transitionend', () => {
    if (rightMenu.style.right === '0px') {
        rightMenuToggle.style.display = 'none';
    } else {
        rightMenuToggle.style.display = '';
    }
});
rightMenuToggle.style.display = '';
</script>
<div id="promotion-modal">
    <div id="promotion-modal-grid">
        <button class="promotion-piece-btn" data-piece="Q" title="Queen">&#9819;</button>
        <button class="promotion-piece-btn" data-piece="R" title="Rook">&#9820;</button>
        <button class="promotion-piece-btn" data-piece="B" title="Bishop">&#9821;</button>
        <button class="promotion-piece-btn" data-piece="N" title="Knight">&#9822;</button>
    </div>
</div>
<script>
// showModal e: eventHandler drag caller, piece: object {name: "wP", row: int, col: int}
function showPromotionModal(e, piece) {
    const pointerX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const pointerY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    
    const modal = document.getElementById('promotion-modal');
    const grid = document.getElementById('promotion-modal-grid');
    // Set piece symbols for color
    const pieces = piece.name[0] === 'w'
        ? ['&#9813;','&#9814;','&#9815;','&#9816;']
        : ['&#9819;','&#9820;','&#9821;','&#9822;'];
    ['Q','R','B','N'].forEach((p, i) => {
        const btn = grid.children[i];
        btn.innerHTML = pieces[i];
        btn.dataset.piece = p;
    });
    // Position modal near cursor, but keep inside viewport
    modal.style.left = Math.min(pointerX, window.innerWidth - 80) + 'px';
    modal.style.top = Math.min(pointerY, window.innerHeight - 260) + 'px';
    modal.style.display = 'block';
    modal.style.opacity = '1';
    // Remove previous listeners
    Array.from(grid.children).forEach(btn => {
        btn.onclick = null;
        btn.onclick = () => {
            modal.style.display = 'none';
            // Now we finish the promotion
            promotionFinalle(piece, btn.attributes["data-piece"].value );
        };
    });
    
}
function hidePromotionModal() {
    document.getElementById('promotion-modal').style.display = 'none';
}
</script>
<!-- Modal Dialog Container -->
<div id="modal-dialog" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:8px; box-shadow:0 4px 32px rgba(0,0,0,0.18); min-width:300px; max-width:90vw; padding:28px 22px 18px 22px; position:relative; display:flex; flex-direction:column; align-items:center;">
        <button id="modal-close-btn" style="position:absolute; top:10px; right:12px; background:none; border:none; font-size:1.5em; color:#888; cursor:pointer;">&times;</button>
        <div id="modal-content"></div>
    </div>
</div>

<!-- Notification Container -->
<div id="notification-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 2100; display: flex; flex-direction: column; gap: 12px; max-width: 360px;">
</div>

<script src="static/js/game.js"></script>
<script src="static/js/ui.js"></script>

renderChessBoard(64, boardArray);

</body>
</html>
