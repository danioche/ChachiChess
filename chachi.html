<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChachiChess &#9822;&#9823;</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/board.css">
    <link rel="stylesheet" href="static/css/menu.css">
</head>
<body>
<div class="chess-board-container" id="chess-board-container"></div>
<button id="side-menu-toggle" title="Menu">&#9776;</button>
<div id="side-menu">
    <div id="side-menu-header">ChachiChess &#9822;&#9823;</div>
    <div id="side-menu-content">
        <div>
            <label for="player1-name">White's Player:</label>
            <input type="text" id="player1-name" placeholder="White" autocomplete="off">
        </div>
        <div>
            <label for="player2-name">Black's Player:</label>
            <input type="text" id="player2-name" placeholder="Black" autocomplete="off">
        </div>
        <div>
            <label for="pgn-area">PGN Notation:</label>
            <textarea id="pgn-area" readonly></textarea>
        </div>
        <button id="fen-btn">Get FEN</button>
        <button id="restart-btn">Restart Game</button>
        <button id="flip-board-btn">Flip Board</button>
    </div>
</div>
<!-- Modal Dialog Container -->
<div id="modal-dialog" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:8px; box-shadow:0 4px 32px rgba(0,0,0,0.18); min-width:300px; max-width:90vw; padding:28px 22px 18px 22px; position:relative; display:flex; flex-direction:column; align-items:center;">
        <button id="modal-close-btn" style="position:absolute; top:10px; right:12px; background:none; border:none; font-size:1.5em; color:#888; cursor:pointer;">&times;</button>
        <div id="modal-content"></div>
    </div>
</div>
<script src="static/js/game.js"></script>
<script src="static/js/ui.js"></script>
<script>
// Initial render with default size and boardArray
renderChessBoard(64, boardArray);
</script>
</body>
</html>
